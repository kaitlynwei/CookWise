<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Search the CookWise recipe catalog by title."
    >
    <title>Find Recipes | CookWise</title>
    <!-- Served only through CookWise page routes. -->
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header>
      <p><a href="/">CookWise</a></p>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/recipes" aria-current="page">Find Recipes</a>
        <a href="/nutrition">Macro Guide</a>
        <a href="/about">About</a>
        <a href="/profile">Profile</a>
      </nav>
    </header>

    <main>
      <h1>Find Recipes</h1>
      <p>
        Choose one approachable dish and get cooking. Search the catalog by
        recipe title, then open a recipe for its current details.
      </p>

      <form id="recipe-filters">
        <p>
          <label for="recipe-search">Search by recipe title:</label>
          <input
            id="recipe-search"
            name="search"
            type="search"
            placeholder="Example: pasta"
          >
        </p>

        <p>
          <label for="sort-recipes">Sort:</label>
          <select id="sort-recipes" name="sort">
            <option value="rotate">Fresh daily rotation</option>
            <option value="name">Recipe name</option>
          </select>
        </p>

        <button type="reset">Clear filters</button>
      </form>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Recipe Results</h2>
        <p id="result-count" aria-live="polite"></p>
        <div id="recipe-results"></div>
        <p class="load-more-row">
          <button id="load-more-recipes" type="button" hidden>
            Load more recipes
          </button>
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 CookWise</p>
    </footer>

    <script src="/js/recipes.js"></script>
  </body>
</html>
