<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a CookWise account.">
    <title>Sign Up | CookWise</title>
    <!-- Served only through CookWise page routes. -->
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header>
      <p><a href="/">CookWise</a></p>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/recipes">Find Recipes</a>
        <a href="/nutrition">Macro Guide</a>
        <a href="/about">About</a>
        <a href="/signin">Sign In</a>
      </nav>
    </header>

    <main>
      <h1>Create an Account</h1>
      <p>
        Create a private local CookWise account. After signing up, you can add
        your profile information.
      </p>

      <form id="signup-form" data-mode="signup">
        <p>
          <label for="username">Username:</label>
          <input
            id="username"
            name="username"
            type="text"
            minlength="3"
            maxlength="30"
            pattern="[A-Za-z0-9_-]+"
            autocomplete="username"
            required
          >
        </p>
        <p>
          <label for="password">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >
          <button
            class="password-toggle"
            type="button"
            data-password-target="password"
            aria-pressed="false"
          >Show password</button>
        </p>
        <p>
          <label for="confirm-password">Confirm password:</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >
          <button
            class="password-toggle"
            type="button"
            data-password-target="confirm-password"
            aria-pressed="false"
          >Show password</button>
        </p>
        <button type="submit">Sign Up</button>
        <p id="auth-message" role="status" aria-live="polite"></p>
      </form>

      <p>Already have an account? <a href="/signin">Sign in</a>.</p>
    </main>

    <footer>
      <p>&copy; 2026 CookWise</p>
    </footer>

    <script src="/js/auth.js"></script>
  </body>
</html>
