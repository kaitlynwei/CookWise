<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Manage your CookWise profile and view personal macro context."
    >
    <title>My Profile | CookWise</title>
  </head>
  <body>
    <header>
      <p><a href="index.html">CookWise</a></p>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="recipes.html">Find Recipes</a>
        <a href="nutrition.html">Macro Guide</a>
        <a href="about.html">About</a>
        <a href="profile.html" aria-current="page">My Profile</a>
      </nav>
    </header>

    <main>
      <h1>My Profile</h1>
      <p>Signed in as <strong id="profile-username"></strong>.</p>

      <form id="profile-form">
        <p>
          <label for="name">Name:</label>
          <input
            id="name"
            name="name"
            type="text"
            maxlength="100"
            autocomplete="name"
            required
          >
        </p>
        <p>
          <label for="height">Height in centimeters:</label>
          <input
            id="height"
            name="heightCm"
            type="number"
            min="50"
            max="250"
            step="0.1"
            required
          >
        </p>
        <p>
          <label for="weight">Weight in kilograms:</label>
          <input
            id="weight"
            name="weightKg"
            type="number"
            min="20"
            max="400"
            step="0.1"
            required
          >
        </p>
        <p>
          <label for="gender">Gender:</label>
          <select id="gender" name="gender" required>
            <option value="">Choose an option</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="nonbinary">Nonbinary</option>
            <option value="prefer-not">Prefer not to say</option>
          </select>
        </p>
        <button type="submit">Save Profile</button>
        <p id="profile-message" role="status" aria-live="polite"></p>
      </form>

      <section aria-labelledby="personal-heading">
        <h2 id="personal-heading">Personal Macro Context</h2>
        <div id="personal-context">
          <p>Save your profile to see your personal context.</p>
        </div>
      </section>

      <button id="signout-button" type="button">Sign Out</button>
    </main>

    <footer>
      <p>&copy; 2026 CookWise</p>
    </footer>

    <script src="js/profile.js"></script>
  </body>
</html>
