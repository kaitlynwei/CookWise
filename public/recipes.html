<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Search CookWise recipes by name, cuisine, difficulty, and cook time."
    >
    <title>Find Recipes | CookWise</title>
  </head>
  <body>
    <header>
      <p><a href="index.html">CookWise</a></p>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="recipes.html" aria-current="page">Find Recipes</a>
        <a href="nutrition.html">Macro Guide</a>
        <a href="about.html">About</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>

    <main>
      <h1>Find Recipes</h1>
      <p>
        Search the current recipe collection or narrow it by cuisine,
        difficulty, and cook time.
      </p>

      <form id="recipe-filters">
        <p>
          <label for="recipe-search">Search by recipe or ingredient:</label>
          <input
            id="recipe-search"
            name="search"
            type="search"
            placeholder="Example: pasta or chickpeas"
          >
        </p>

        <p>
          <label for="cuisine-filter">Cuisine:</label>
          <select id="cuisine-filter" name="cuisine">
            <option value="">All cuisines</option>
          </select>
        </p>

        <p>
          <label for="difficulty-filter">Difficulty:</label>
          <select id="difficulty-filter" name="difficulty">
            <option value="">All difficulty levels</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </p>

        <p>
          <label for="dish-filter">Meal type:</label>
          <select id="dish-filter" name="dishType">
            <option value="">Sweet and savory</option>
            <option value="Savory">Savory</option>
            <option value="Sweet">Sweet</option>
            <option value="Breakfast">Breakfast</option>
          </select>
        </p>

        <p>
          <label for="time-filter">Maximum cook time:</label>
          <select id="time-filter" name="time">
            <option value="">Any cook time</option>
            <option value="20">20 minutes or less</option>
            <option value="30">30 minutes or less</option>
            <option value="45">45 minutes or less</option>
            <option value="60">60 minutes or less</option>
          </select>
        </p>

        <p>
          <label for="sort-recipes">Sort:</label>
          <select id="sort-recipes" name="sort">
            <option value="smart">CookWise smart ranking</option>
            <option value="popularity">Provider rating and popularity</option>
            <option value="health">Health score</option>
            <option value="name">Recipe name</option>
            <option value="time">Fastest first</option>
          </select>
        </p>

        <button type="reset">Clear filters</button>
      </form>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Recipe Results</h2>
        <p id="result-count" aria-live="polite"></p>
        <div id="recipe-results"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 CookWise</p>
    </footer>

    <script src="js/recipes.js"></script>
  </body>
</html>
